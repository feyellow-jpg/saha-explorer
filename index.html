        body {
            font-family: 'Nanum Gothic', sans-serif;

            user-select: none;
        }
        .font-jua {

        @keyframes gentle-bounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }

        .wave-bar:nth-child(2) { animation-delay: 0.2s; }

<body class="min-h-screen text-slate-800 flex flex-col antialiased">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 선생님의 파이어베이스 고유 열쇠 정보입니다! 😊
        const myFirebaseConfig = {
            apiKey: "AIzaSyCS8kWxKMV9qk06wxeEaYnNa9FK652CDsU",
            authDomain: "sahagu-69868.firebaseapp.com",
            projectId: "sahagu-69868",
            storageBucket: "sahagu-69868.firebasestorage.app",
            messagingSenderId: "635938643907",
            appId: "1:635938643907:web:c6fc1a012c7acea1a76776"
        };

        let useFirebase = false;
        let db = null;
        let auth = null;
        let appId = typeof __app_id !== 'undefined' ? __app_id : 'saha-explorer-default';

        let firebaseConfig = null;
        if (myFirebaseConfig && myFirebaseConfig.apiKey) {
            firebaseConfig = myFirebaseConfig;
        } else {
            const firebaseConfigStr = typeof __firebase_config !== 'undefined' ? __firebase_config : null;
            if (firebaseConfigStr) {
                try {
                    firebaseConfig = JSON.parse(firebaseConfigStr);
                } catch (e) {
                    console.warn("Global config parsing failed.", e);
                }
            }
        }

        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        if (firebaseConfig && firebaseConfig.apiKey) {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                useFirebase = true;
                console.log("Firebase Cloud Database successfully initialized.");
            } catch (e) {
                console.error("Firebase initialization failed:", e);
            }
        }

        let currentUser = null;
        const mockAuthListeners = [];

        window.dbService = {
            isCloudMode() {
                return useFirebase;
            },
            async signIn() {
                if (useFirebase) {
                    if (initialAuthToken) {
                        await signInWithCustomToken(auth, initialAuthToken);
                    } else {
                        await signInAnonymously(auth);
                    }
                } else {
                    let uid = localStorage.getItem('saha_uid') || 'student_' + Math.random().toString(36).substr(2, 9);
                    localStorage.setItem('saha_uid', uid);
                    currentUser = { uid: uid, isAnonymous: true };
                    mockAuthListeners.forEach(cb => cb(currentUser));
                }
            },
            onAuthChange(callback) {
                if (useFirebase) {
                    return onAuthStateChanged(auth, callback);
                } else {
                    mockAuthListeners.push(callback);
                    if (currentUser) callback(currentUser);
                    return () => {
                        const index = mockAuthListeners.indexOf(callback);
                        if (index > -1) mockAuthListeners.splice(index, 1);
                    };
                }
            },
            async saveStudentProgress(uid, data) {
                if (useFirebase) {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'students', uid);
                    await setDoc(docRef, data, { merge: true });
                } else {
                    const localStudents = JSON.parse(localStorage.getItem('saha_students') || '{}');
                    localStudents[uid] = { ...localStudents[uid], ...data, uid };
                    localStorage.setItem('saha_students', JSON.stringify(localStudents));
                    this.triggerLocalDbChange();
                }
            },
            async deleteStudent(uid) {
                if (useFirebase) {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'students', uid);
                    await deleteDoc(docRef);
                } else {
                    const localStudents = JSON.parse(localStorage.getItem('saha_students') || '{}');
                    delete localStudents[uid];
                    localStorage.setItem('saha_students', JSON.stringify(localStudents));
                    this.triggerLocalDbChange();
                }
            },
            listenToAllStudents(onSuccess, onError) {
                if (useFirebase) {
                    const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'students');
                    return onSnapshot(colRef, (snapshot) => {
                        const students = [];
                        snapshot.forEach(doc => {
                            students.push({ uid: doc.id, ...doc.data() });
                        });
                        onSuccess(students);
                    }, onError);
                } else {
                    const getLocalStudents = () => {
                        const localStudents = JSON.parse(localStorage.getItem('saha_students') || '{}');
                        return Object.values(localStudents);
                    };
                    onSuccess(getLocalStudents());
                    const handler = () => onSuccess(getLocalStudents());
                    window.addEventListener('saha_db_change', handler);
                    return () => window.removeEventListener('saha_db_change', handler);
                }
            },
            triggerLocalDbChange() {
                window.dispatchEvent(new Event('saha_db_change'));
            }
        };

        window.initAppUI();
    </script>

                        <p class="text-xs text-slate-500 font-semibold flex items-center gap-1">
                            <span id="storage-mode-badge" class="px-
